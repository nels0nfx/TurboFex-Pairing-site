name: Replace repository from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate and extract replacement ZIP
        run: |
          set -euo pipefail
          test -f site-replacement.zip || { echo "Upload site-replacement.zip to the repository root first."; exit 1; }
          mkdir -p /tmp/site-replacement
          unzip -Z1 site-replacement.zip > /tmp/zip-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/zip-files.txt; then
            echo "Unsafe path detected in ZIP."
            exit 1
          fi
          unzip -q site-replacement.zip -d /tmp/site-replacement
          test -n "$(find /tmp/site-replacement -mindepth 1 -print -quit)" || { echo "ZIP is empty."; exit 1; }

      - name: Replace repository files
        run: |
          set -euo pipefail
          rsync -a --delete /tmp/site-replacement/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Replace repository with uploaded ZIP"
          git push origin HEAD:main
