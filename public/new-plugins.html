<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurboFex | Plugins</title>
<meta name="description" content="Add features to your TurboFex bot. Every plugin is reviewed and signed before it is published.">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/tf2-theme.js"></script>
<link rel="stylesheet" href="/tf2.css">
<link rel="stylesheet" href="/tf2-scenes.css">
<link rel="stylesheet" href="/tf2-plugins.css">
<link rel="stylesheet" href="/tf2-store.css">
</head>
<body>
<!--tfx:head2-->
<main id="main" class="pl">

  <div id="pbrowse">
    <section class="wrap ph"><div class="col">
      <h1 class="page">Plugins</h1>
  <div class="sc s-plug" aria-hidden="true"><div class="st"><div class="o cd c1"><div class="t"><div class="gp"><span class="ic3"></span><i class="l3b w3"></i><i class="l3b w2"></i><span class="pl3"></span><span class="ck3"></span></div></div></div><div class="o cd c2"><div class="t"><div class="gp"><span class="ic3"></span><i class="l3b w3"></i><i class="l3b w2"></i><span class="pl3"></span><span class="ck3"></span></div></div></div><div class="o cd c3"><div class="t"><div class="gp"><span class="ic3"></span><i class="l3b w3"></i><i class="l3b w2"></i><span class="pl3"></span><span class="ck3"></span></div></div></div></div></div>
      <div class="pfind">
        <label class="sr" for="psearch">Search plugins</label>
        <svg class="sico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="psearch" type="search" placeholder="Search plugins" autocomplete="off" maxlength="40" disabled>
      </div>
      <div class="pfilters" id="pfilters" role="group" aria-label="Filter plugins"></div>
      <div class="pbar">
        <p class="pcount" id="pcount" aria-live="polite">Loading…</p>
        <label class="psort"><span class="sr">Sort plugins</span><select id="psort"><option value="feat">Featured first</option><option value="new">Newest</option><option value="name">A to Z</option><option value="rate">Top rated</option></select></label>
      </div>
    </div></section>

    <section id="pfeat" class="psec feat" hidden><div class="wrap"><div class="col"><div class="shead"><h2>Featured</h2></div></div></div><div id="pfeatlist" class="pcar"></div></section>
    <div class="wrap"><div class="col">
      <section class="psec"><div class="shead" id="pallhead" hidden><h2>All plugins</h2></div><div id="plist" class="pl2" aria-live="polite"><div class="skel pk"></div><div class="skel pk"></div><div class="skel pk"></div></div></section>
      <p class="pempty" id="pempty" hidden></p>
      <section id="pcols" class="psec" hidden></section>
    </div></div>

    <section class="wrap sec"><div class="col">
      <p class="howto"><b>To install</b> send <code>.plugin install</code> and the name, then <code>.plugin confirm</code> with the code the bot gives you. Owner only.</p>
      <ul class="trust"><li><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-key"/></svg>Signed</li><li><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye"/></svg>Reviewed</li><li><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-box"/></svg>Sandboxed</li></ul>
    </div></section>
  </div>

  <div class="wrap"><div class="col"><div id="pdetail" hidden></div></div></div>
</main>
<script src="/tf2.js"></script>
<script src="/tf2-scenes.js"></script>
<script src="/tf2-plugins.js"></script>
</body>
</html>
