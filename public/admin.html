<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TurboFex Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070707">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/tf2-theme.js"></script>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/tf2-load.css">
<script src="/tf2-load.js"></script>
<link rel="stylesheet" href="/tfx.css">
<link rel="stylesheet" href="/admin3.css">
<link rel="stylesheet" href="/admin4.css">
<link rel="stylesheet" href="/tf2-scenes.css">
<link rel="stylesheet" href="/admin5.css">
<link rel="stylesheet" href="/tf2-icons.css">
</head>
<body class="adm">

<!-- sign in -->
<main id="login" class="lg" hidden>
  <section class="lg-art" aria-hidden="true">
    <div class="sc s-adm"><div class="st">
      <span class="wr3 w-a"><i></i></span><span class="wr3 w-b"><i></i></span>
      <div class="o ac"><div class="t"><div class="gp"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span><i class="l3b w2"></i></div></div></div>
      <div class="o as"><div class="t"><span class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.8v5.5c0 4.2-2.8 7.8-7 9.2-4.2-1.4-7-5-7-9.2V5.8z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span></div></div>
      <div class="o al"><div class="t"><div class="gp"><span class="cd6"><i></i><i></i><i></i><i></i><i></i><i></i></span><i class="l3b w3"></i><i class="l3b w2"></i></div></div></div>
    </div></div>
    <p class="lg-note">Pairing, plugins, reviews and server health in one place.</p>
  </section>
  <div class="lg-box">
    <div class="lg-brand"><span class="logo"><img class="lb-d" src="/logo-brand-dark.png" alt="" width="34" height="24"><img class="lb-l" src="/logo-brand-light.png" alt="" width="34" height="24"></span><b>Turbo<span class="gold">Fex</span></b><span class="chip">Admin</span></div>
    <h1>Sign in</h1>
    <p class="muted">For TurboFex administrators only.</p>
    <form id="f-login" method="post" action="/admin/api/noop" target="tfxframe" autocomplete="on" novalidate>
      <label for="u">Username</label>
      <input id="u" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" maxlength="200" required>
      <label for="c">6-digit code <span class="opt">(not needed on a trusted device)</span></label>
      <input id="c" name="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="7" placeholder="123456">
      <label class="chk" for="trust"><input id="trust" name="trust" type="checkbox"><span>Trust this device for 30 days</span></label>
      <button class="cta" id="b-login" type="submit"><span>Sign in</span></button>
    </form>
    <iframe name="tfxframe" id="tfxframe" title="" hidden tabindex="-1"></iframe>
    <p class="err" id="lg-err" role="alert"></p>
    <a class="back" href="/">Back to TurboFex</a>
  </div>
</main>

<!-- dashboard -->
<div id="app" class="ashell" hidden>
  <aside class="side">
    <a class="ab" href="/admin" aria-label="TurboFex admin"><span class="logo"><img class="lb-d" src="/logo-brand-dark.png" alt="" width="34" height="24"><img class="lb-l" src="/logo-brand-light.png" alt="" width="34" height="24"></span><b>Turbo<span class="gold">Fex</span></b><span class="chip">Admin</span></a>
    <nav class="nav" id="nav" role="tablist" aria-label="Dashboard sections"></nav>
    <nav class="asite" aria-label="TurboFex site"><span class="asite-h">TurboFex site</span><a href="/pair">Pairing page</a><a href="/plugins">Marketplace</a><a href="/developers">Developer Centre</a><a href="/plugin-guide">Plugin guide</a><a href="/playground">Playground</a></nav>
    <div class="who"><span class="av" aria-hidden="true"></span><span class="wt"><b id="who-u"></b><small id="who-r"></small></span></div>
  </aside>

  <div class="main">
    <header class="ah">
      <a class="ab ab-m" href="/admin" aria-label="TurboFex admin"><span class="logo"><img class="lb-d" src="/logo-brand-dark.png" alt="" width="34" height="24"><img class="lb-l" src="/logo-brand-light.png" alt="" width="34" height="24"></span><b>Turbo<span class="gold">Fex</span></b><span class="chip">Admin</span></a>
      <span class="ah-sp"></span>
      <button id="menu" class="ibtn amenubtn" type="button" aria-label="Menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><i class="n" id="menu-n" hidden></i></button>
      <button id="theme" class="ibtn themebtn" type="button" aria-label="Switch theme" title="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.200A8 8 0 0 1 9.800 4 8.500 8.500 0 1 0 20 14.200z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600l1.400 1.400M17 17l1.400 1.400M5.600 18.400L7 17M17 7l1.400-1.400" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button id="out" class="ibtn" type="button" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>
    <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
  </div>
  <nav class="atabbar" id="tabbar" aria-label="Sections"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<noscript><p class="lg-box">This dashboard needs JavaScript.</p></noscript>
<script src="/admin.js"></script>
<script src="/tf2-scenes.js"></script>
<script src="/tf2-icons.js"></script>
</body>
</html>
